<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekal Handloom Management System</title>
<!-- Google Fonts for crisp & modern typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #11382c;
  --primary-light: #174c3d;
  --primary-accent: #226d58;
  --primary-subtle: #f0f7f4;
  --primary-border: #cbe3d9;
  --bg-main: #f4f7f6;
  --text-dark: #111827;
  --text-muted: #6b7280;
  --surface: #ffffff;
  --border-color: #e5e7eb;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
}

*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans', Arial, sans-serif;background:var(--bg-main);color:var(--text-dark);-webkit-font-smoothing:antialiased}

/* Header Styling */
header{
  height:70px;
  background:linear-gradient(135deg, #0d2e24 0%, var(--primary-light) 100%);
  color:#fff;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
  border-bottom:1px solid rgba(255,255,255,0.1)
}
.logo-container{display:flex;align-items:center;gap:14px}
.brand-icon{
  width:42px;
  height:42px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.2)
}
.brand-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{font-weight:800;font-size:19px;letter-spacing:-0.3px;color:#ffffff}
.sub{font-size:11.5px;color:rgba(255,255,255,0.75);margin-top:1px;font-weight:500}

/* Aside Navigation */
aside{
  width:250px;
  background:var(--surface);
  border-right:1px solid var(--border-color);
  position:fixed;
  top:70px;
  bottom:0;
  padding:16px 12px;
  overflow-y:auto;
  z-index:40;
  box-shadow:2px 0 10px rgba(0,0,0,0.02)
}
nav button{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:11px 14px;
  border-radius:8px;
  margin:4px 0;
  cursor:pointer;
  font-size:13.5px;
  font-weight:600;
  color:#4b5563;
  display:flex;
  align-items:center;
  gap:12px;
  transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)
}
nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0.75;transition:all 0.2s}
nav button.active,nav button:hover{background:var(--primary-subtle);color:var(--primary);font-weight:700}
nav button.active svg,nav button:hover svg{opacity:1;stroke:var(--primary)}

/* Main Layout */
main{margin-left:250px;padding:28px;min-height:calc(100vh - 70px)}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card,.panel{
  background:var(--surface);
  border:1px solid var(--border-color);
  border-radius:12px;
  padding:20px;
  box-shadow:var(--shadow-sm);
  transition:all 0.2s ease
}
.card{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border-top:4px solid var(--primary-light);
  background:linear-gradient(180deg, #ffffff 0%, #fbfcfc 100%)
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.num{font-size:26px;font-weight:800;margin-top:8px;color:var(--primary);letter-spacing:-0.5px}
.muted{color:var(--text-muted);font-size:12.5px;font-weight:500}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-top:20px}

/* Tables & Controls */
.table-responsive{overflow-x:auto;width:100%;margin-top:12px;border-radius:10px;border:1px solid var(--border-color)}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{padding:12px 16px;border-bottom:1px solid var(--border-color);text-align:left;font-size:13px}
th{background:#f9fafb;color:#374151;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:0.5px}
tr:last-child td{border-bottom:none}
tr:hover{background:#f8faf9}

.btn{
  border:1px solid #d1d5db;
  background:#fff;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:12.5px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:8px;
  box-shadow:0 1px 2px rgba(0,0,0,0.05);
  transition:all 0.2s ease
}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:#f9fafb;border-color:#9ca3af}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:6px}
.primary{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
.primary:hover{background:var(--primary);border-color:var(--primary)}

/* Badges */
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;background:#e6f4ed;color:#16714b}
.pending{background:#fef3c7;color:#92400e}
.inactive{background:#fee2e2;color:#991b1b}
.danger{color:#dc2626;border-color:#fca5a5;background:#fef2f2}.danger:hover{background:#fee2e2}
.edit-btn{color:var(--primary-light);border-color:var(--primary-border);background:var(--primary-subtle)}.edit-btn:hover{background:#e1f0ea}

/* Forms & Modals */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12px;color:#374151;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:13px;
  background:#fff;
  outline:none;
  transition:all 0.2s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(23, 76, 61, 0.1)}
.full{grid-column:1/-1}

.modal{display:none;position:fixed;inset:0;background:rgba(17,24,39,0.6);align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:24px;width:min(720px,94vw);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modalhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border-color)}
.modalhead h3{margin:0;font-size:19px;color:var(--primary);font-weight:700}

/* Login */
.login{position:fixed;inset:0;background:linear-gradient(135deg, #0d2e24 0%, #174c3d 100%);display:flex;align-items:center;justify-content:center;z-index:300}
.loginbox{background:#fff;padding:36px;border-radius:18px;width:420px;box-shadow:var(--shadow-lg)}
.loginbox input{width:100%;padding:11px;margin:8px 0;border:1px solid #d1d5db;border-radius:8px;outline:none}
.loginbox input:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(23, 76, 61, 0.1)}

.toast{position:fixed;right:24px;bottom:24px;background:var(--primary);color:#fff;padding:12px 22px;border-radius:10px;display:none;z-index:400;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg)}
.small{font-size:11.5px}
.actions{white-space:nowrap;display:flex;gap:6px}
.filter-bar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;background:var(--surface);padding:12px 16px;border-radius:10px;border:1px solid var(--border-color);box-shadow:var(--shadow-sm)}
.filter-bar input,.filter-bar select{padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:12.5px;outline:none}

.tag{font-size:10px;padding:3px 8px;border-radius:6px;background:#f3f4f6;color:#374151;font-weight:700;text-transform:uppercase}
.tag-admin{background:#dcfce7;color:#15803d}
.locked-banner{padding:12px 16px;background:#fef2f2;border-left:4px solid #ef4444;color:#991b1b;margin-bottom:16px;border-radius:0 8px 8px 0;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm)}

/* Admin Panel Grid */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
.admin-card{background:#fff;border:1px solid var(--border-color);border-radius:14px;padding:22px;cursor:pointer;transition:all 0.25s ease;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.admin-card::before{content:"";position:absolute;top:0;left:0;width:5px;height:100%;background:var(--primary-light);opacity:0;transition:opacity 0.2s ease}
.admin-card:hover{transform:translateY(-4px);box-shadow:0 12px 20px -5px rgba(23,76,61,0.12);border-color:var(--primary-border)}
.admin-card:hover::before{opacity:1}
.admin-card-header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.admin-card-icon{width:46px;height:46px;border-radius:12px;background:var(--primary-subtle);display:flex;align-items:center;justify-content:center;color:var(--primary-light);flex-shrink:0}
.admin-card-icon svg{width:24px;height:24px;stroke:var(--primary-light);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admin-card-title{margin:0;color:var(--primary);font-size:16.5px;font-weight:700}
.admin-card-desc{color:var(--text-muted);font-size:12.5px;line-height:1.5;margin:0 0 16px 0}
.admin-card-footer{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--primary-light);border-top:1px solid #f3f4f6;padding-top:12px;margin-top:auto}

.view-only-lock{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;font-size:11px;font-weight:600}
.view-only-lock svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media print {
  header, aside, .filter-bar, .btn, .locked-banner { display: none !important; }
  main { margin-left: 0 !important; padding: 0 !important; }
  .panel { border: none !important; box-shadow: none !important; margin-bottom: 20px !important; }
  body { background: #fff !important; }
}

@media(max-width:900px){aside{width:210px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}main{margin-left:210px}}
@media(max-width:650px){aside{display:none}main{margin-left:0;padding:16px}.cards,.form{grid-template-columns:1fr}}
</style>
</head>

<script>
"use strict";

const KEY = "ekal_handloom_persistent_v13";
const SESSION = "ekal_handloom_session_v13";
const DAILY_SNAP_KEY = "ekal_handloom_daily_snapshot_v13";

// Helper function to check if a user is an Admin or Executive (who see all centres)
function isExecutiveOrAdmin(u) {
 if (!u) return false;
 return u.role === "ADMINISTRATOR" || u.role === "EXECUTIVE_DIRECTOR" || u.role === "EXECUTIVE_ASSISTANT" || u.centre === "All Centres";
}

// Helper function to filter array items based on logged in user's centre access
function filterByCentreAccess(items, centreProp = "centre") {
 const u = getCurrentUser();
 if (!u) return [];
 if (isExecutiveOrAdmin(u)) return items;
 return items.filter(x => {
   const val = x[centreProp] || x.name;
   return val === "All Centres" || val === u.centre;
 });
}

function logUserActivity(action, details) {
 const u = getCurrentUser();
 if(!u) return;
 if(!db.activityLogs) db.activityLogs = [];
 db.activityLogs.unshift({
   id: nextId("act"),
   timestamp: new Date().toLocaleString(),
   userName: u.name,
   userEmail: u.email,
   userRole: u.role,
   action: action,
   details: details
 });
 if(db.activityLogs.length > 500) db.activityLogs.pop();
 localStorage.setItem(KEY, JSON.stringify(db));
}

function checkDailySnapshot(data) {
 try {
  const today = new Date().toISOString().slice(0, 10);
  const rawSnap = localStorage.getItem(DAILY_SNAP_KEY);
  let snapObj = rawSnap ? JSON.parse(rawSnap) : null;
  if (!snapObj || snapObj.date !== today) {
    if (snapObj) {
      localStorage.setItem("ekal_handloom_prev_day_snapshot", JSON.stringify(snapObj));
    } else {
      localStorage.setItem("ekal_handloom_prev_day_snapshot", JSON.stringify({ date: today, data: data }));
    }
    snapObj = { date: today, data: data };
    localStorage.setItem(DAILY_SNAP_KEY, JSON.stringify(snapObj));
  }
 } catch(e) {}
}

function autoRecoverCrash() {
 try {
  const rawData = localStorage.getItem(KEY);
  if (!rawData) {
    const prevSnap = localStorage.getItem("ekal_handloom_prev_day_snapshot") || localStorage.getItem(DAILY_SNAP_KEY);
    if (prevSnap) {
      const snapObj = JSON.parse(prevSnap);
      if (snapObj && snapObj.data) {
        localStorage.setItem(KEY, JSON.stringify(snapObj.data));
        showToast("⚠️ Crash Detected: Automatically recovered data up to 1 day prior!");
      }
    }
  }
 } catch(e) {}
}

function loadDB() {
 autoRecoverCrash();
 try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const data = JSON.parse(raw);
    if (!data.customRoles) data.customRoles = ["OFFICE_ADMIN"];
    if (!data.activityLogs) data.activityLogs = [];
    checkDailySnapshot(data);
    return data;
  }
 } catch(e){}
 localStorage.setItem(KEY, JSON.stringify(demo));
 checkDailySnapshot(demo);
 return JSON.parse(JSON.stringify(demo));
}

function saveDB(msg = "✓ Saved successfully") {

}

function nextId(prefix) {
 return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,6);
}

function esc(s) {
 return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function fmtNum(v) {
 const n = Number(v || 0);
 return isNaN(n) ? "0.00" : n.toFixed(2);
}

function sendOTP() {
 const ph = document.getElementById("loginPhone").value.trim();

 const u = db.users.find(x => x.phone === ph || x.email.toLowerCase() === ph.toLowerCase());
 if(!u) return alert("No registered user found with this mobile number/email!");

 generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
 otpMobileTarget = u;
 
 document.getElementById("loginOtp").style.display = "block";
 alert(`[DEMO OTP SERVICE] Your OTP for Ekal Handloom Sign In is: ${generatedOtp}`);
 showToast(`OTP sent to ${u.phone || u.email}!`);
}

function canEditModule(mod, targetCentre = null) {
 const u = getCurrentUser();
 if (!u) return false;
 if (u.accessLevel === "VIEW_ONLY" || u.role === "HR") return false;
 if (u.role === "ADMINISTRATOR" || u.role === "EXECUTIVE_DIRECTOR" || u.role === "EXECUTIVE_ASSISTANT" || u.accessLevel === "FULL") return true;
 
 if (u.role === "CENTRE_INCHARGE" || u.role === "OFFICE_ADMIN") {
   if (targetCentre && u.centre !== "All Centres" && targetCentre !== u.centre) {
     return false; 
   }
   return ["attendance", "production", "centres", "yarn", "workers", "payments", "tasks"].includes(mod);
 }
 if (mod === "training") {
   return ["PROJECT_HEAD_INTERNAL", "PROJECT_HEAD_EXTERNAL", "PROJECT_COORDINATOR"].includes(u.role);
 }
 return u.accessLevel === "EDIT";
}

   document.getElementById("loginPass").value = u ? u.pass || "" : "";
   if(u && u.phone) document.getElementById("loginPhone").value = u.phone;
 }
}

function login() {
 let u = null;

 if(currentLoginMode === 'pass') {
   const em = document.getElementById("loginEmail").value.trim().toLowerCase();
   const pw = document.getElementById("loginPass").value;

   if(!em) return alert("Please enter Email ID or Phone.");
   if(!pw) return alert("Please enter Password.");

   u = db.users.find(x => (x.email.toLowerCase() === em || x.phone === em) && (x.pass ? x.pass === pw : true));
   if (!u) return alert("Invalid Email/Phone or Password!");
 } else {
   const enteredOtp = document.getElementById("loginOtp").value.trim();
   if(!generatedOtp || !otpMobileTarget) return alert("Please click 'Send OTP' first.");
   if(enteredOtp !== generatedOtp) return alert("Invalid OTP entered!");
   u = otpMobileTarget;
 }

 localStorage.setItem(SESSION, JSON.stringify(u));
 logUserActivity("LOGIN", `User signed in via ${currentLoginMode.toUpperCase()}`);
 startApp();
 showToast(`Welcome, ${u.name}!`);
}

document.getElementById("loginBtn").onclick = login;

function downloadCSV(csvContent, fileName) {
 const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
 const link = document.createElement("a");
 const url = URL.createObjectURL(blob);
 link.setAttribute("href", url);
 link.setAttribute("download", fileName);
 link.style.visibility = 'hidden';
 document.body.appendChild(link);
 link.click();
 document.body.removeChild(link);
}

function exportAttendanceExcel(selectedCentre) {
 const accessibleWorkers = filterByCentreAccess(db.workers, "centre");
 const displayWorkers = selectedCentre === "All" ? accessibleWorkers : accessibleWorkers.filter(w => w.centre === selectedCentre);
 let csv = "Worker Name,Centre,Date,Attendance Status\n";
 
 displayWorkers.forEach(w => {
   const logs = db.attendance.filter(a => a.workerId === w.id);
   if(logs.length === 0) {
     csv += `"${w.name}","${w.centre}","N/A","No Record"\n`;
   } else {
     logs.forEach(l => {
       csv += `"${w.name}","${w.centre}","${l.date}","${l.status}"\n`;
     });
   }
 });

 downloadCSV(csv, `Attendance_Summary_${selectedCentre}_${new Date().toISOString().slice(0,10)}.csv`);
}

function saveAttendance(selectedCentre, date) {
 const u = getCurrentUser();
 const accessibleWorkers = filterByCentreAccess(db.workers, "centre");
 const displayWorkers = selectedCentre === "All" 
   ? accessibleWorkers 
   : accessibleWorkers.filter(w => w.centre === selectedCentre);

 displayWorkers.forEach(w => {
   if (u.centre !== "All Centres" && u.centre !== w.centre) return;
   const statusVal = document.getElementById(`status_${w.id}`)?.value || "Present";
   const idx = db.attendance.findIndex(a => a.date === date && a.workerId === w.id);
   if (idx >= 0) {
     db.attendance[idx].status = statusVal;
   } else {
     db.attendance.push({ id: nextId("att"), date, centre: w.centre, workerId: w.id, workerName: w.name, status: statusVal });
   }
 });
 logUserActivity("UPDATE_ATTENDANCE", `Updated attendance for ${date}`);
 saveDB("✓ Attendance saved successfully");
 attendance();
}

function centreModal(item = null) {
 if (!canEditModule("centres")) return;

 modal(item ? "Edit Centre" : "Add Centre", `
   <div class="form">
     <div class="field"><label>Centre Name *</label><input id="fName" value="${esc(x.name)}"></div>
     <div class="field"><label>State *</label><input id="fState" value="${esc(x.state)}"></div>
     <div class="field"><label>State In-Charge Name *</label><input id="fIncharge" value="${esc(x.incharge)}"></div>
     <div class="field"><label>Opening Date</label><input id="fOpening" type="date" value="${esc(x.opening || '')}"></div>
     <div class="field"><label>Number of Looms</label><input id="fLooms" type="number" value="${x.looms || 0}"></div>
     <div class="field"><label>Status</label>
       <select id="fStatus">
         <option value="Active" ${x.status==="Active"?"selected":""}>Active</option>
         <option value="Inactive" ${x.status==="Inactive"?"selected":""}>Inactive</option>
       </select>
     </div>
   </div>
   <br><button class="btn primary" id="saveBtn">Save Centre</button>
 `);
 document.getElementById("saveBtn").onclick = () => {
   const data = { 
     name: val("fName"), 
     state: val("fState"), 
     incharge: val("fIncharge"), 
     opening: val("fOpening"), 
     looms: Number(val("fLooms") || 0), 
     status: val("fStatus") 
   };

function exportDataCSV(key) {
 const dataArr = filterByCentreAccess(db[key] || [], key === 'centres' ? 'name' : 'centre');
 if (!dataArr.length) return alert("No data available to export.");
 
 const keys = Object.keys(dataArr[0]);
 let csv = keys.join(",") + "\n";
 dataArr.forEach(row => {
   csv += keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`).join(",") + "\n";
 });
 downloadCSV(csv, `Ekal_${key}_Report_${new Date().toISOString().slice(0,10)}.csv`);
}

function processAIQuery() {
 const q = val("aiQuery").toLowerCase();
 const resEl = document.getElementById("aiResponse");
 if (!q) return;
 
 resEl.style.display = "block";
 let answer = "AI Analysis: I could not match your query with current database records. Try asking about 'centres', 'yarn', or 'production'.";

 if (q.includes("loom") || q.includes("centre")) {
   const totalL = db.centres.reduce((s, c) => s + Number(c.looms || 0), 0);
   answer = `<b>Centre & Loom Insight:</b> There are currently <b>${db.centres.length} active centres</b> with a total capacity of <b>${totalL} looms</b> registered in system.`;
 } else if (q.includes("yarn") || q.includes("stock")) {
   const totalY = db.yarn.reduce((s, y) => s + Number(y.allocated || 0), 0);
   const pendY = db.yarn.reduce((s, y) => s + Number(y.pending || 0), 0);
   answer = `<b>Yarn Inventory Insight:</b> Total allocated yarn is <b>${totalY} kg</b>. Current pending delivery to centres stands at <b>${pendY} kg</b>.`;
 } else if (q.includes("worker") || q.includes("artisan") || q.includes("women")) {
   answer = `<b>Artisan Empowerment Insight:</b> System has <b>${db.workers.length} active women artisans & trainees</b> across all regional project hubs.`;
 }

 resEl.innerHTML = answer;
}

function backup() {
 document.getElementById("main").innerHTML = `
 <div class="title">
   <h2 style="color:var(--primary);font-size:20px;font-weight:800;margin:0">Database Backup & System Recovery</h2>
 </div>
 <div class="panel">
   <h3 style="margin-top:0;color:var(--primary);font-size:16px">Export System Database Backup</h3>
   <p>Save a full snapshot JSON file of centres, workers, yarn stocks, and logs for safekeeping.</p>
   <button class="btn primary" onclick="exportBackup()"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Download Backup JSON</button>
   
   <hr style="margin:24px 0;border:0;border-top:1px solid var(--border-color)">
   
   <h3 style="color:var(--primary);font-size:16px">Restore System Database</h3>
   <p>Upload a JSON backup file to restore system state.</p>
   <input type="file" id="backupFile" accept=".json" style="margin-bottom:12px"><br>
   <button class="btn primary" onclick="restoreBackup()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Upload & Restore JSON Data</button>
 </div>`;
}

function exportBackup() {
 const str = JSON.stringify(db, null, 2);
 const blob = new Blob([str], { type: "application/json" });
 const link = document.createElement("a");
 link.href = URL.createObjectURL(blob);
 link.download = `Ekal_Handloom_Backup_${new Date().toISOString().slice(0,10)}.json`;
 link.click();
}

function restoreBackup() {
 const fileInput = document.getElementById("backupFile");
 if (!fileInput.files.length) return alert("Please select a JSON backup file first.");
 
 const file = fileInput.files[0];
 const reader = new FileReader();
 reader.onload = function(e) {
   try {
     const parsed = JSON.parse(e.target.result);
     if (parsed && parsed.centres && parsed.users) {
       db = parsed;
       saveDB("✓ System restored successfully from JSON backup!");
       setTimeout(() => location.reload(), 1000);
     } else {
       alert("Invalid backup JSON structure.");
     }
   } catch(err) {
     alert("Failed to parse JSON file.");
   }
 };
 reader.readAsText(file);
}
