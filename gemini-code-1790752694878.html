<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekal Handloom Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17221e}
header{height:70px;background:#174c3d;color:#fff;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.logo-container{display:flex;align-items:center;gap:12px}
.brand-icon{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.brand-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{font-weight:800;font-size:18px;letter-spacing:0.3px}.sub{font-size:11px;opacity:.85;margin-top:2px}
aside{width:240px;background:#fff;border-right:1px solid #dfe6e2;position:fixed;top:70px;bottom:0;padding:14px;overflow-y:auto;z-index:40}
nav button{width:100%;border:0;background:#fff;text-align:left;padding:11px 14px;border-radius:8px;margin:3px 0;cursor:pointer;font-size:13.5px;color:#33413b;display:flex;align-items:center;gap:10px;transition:all 0.15s ease}
nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0.75}
nav button.active,nav button:hover{background:#e8f2ed;color:#174c3d;font-weight:700}
nav button.active svg,nav button:hover svg{opacity:1;stroke:#174c3d}
main{margin-left:240px;padding:24px;min-height:calc(100vh - 70px)}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card,.panel{background:#fff;border:1px solid #dfe6e2;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.num{font-size:26px;font-weight:800;margin-top:6px;color:#174c3d}
.muted{color:#68746f;font-size:12px}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.table-responsive{overflow-x:auto;width:100%;margin-top:10px;border-radius:8px;border:1px solid #edf0ef}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{padding:10px 12px;border-bottom:1px solid #edf0ef;text-align:left;font-size:13px}
th{background:#f6f9f7;color:#4a5752;font-weight:700}
tr:hover{background:#fafcfb}
.btn{border:1px solid #c9d4cf;background:#fff;padding:8px 13px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s ease}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:#f0f5f2}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:5px}
.primary{background:#174c3d;color:#fff;border-color:#174c3d}
.primary:hover{background:#113b2f}
.badge{padding:4px 9px;border-radius:12px;font-size:11px;font-weight:600;display:inline-block;background:#e6f4ed;color:#16714b}
.pending{background:#fff2d8;color:#986500}
.inactive{background:#fbeae8;color:#9e2a2b}
.danger{color:#b42318;border-color:#fecdca;background:#fef3f2}.danger:hover{background:#fee4e2}
.edit-btn{color:#174c3d;border-color:#bce3d4;background:#f0fdf7}.edit-btn:hover{background:#dcfce7}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:#4a5752;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #ccd6d1;border-radius:6px;font-size:13px;background:#fff;outline:none}
.full{grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:rgba(12,28,23,0.65);align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px)}
.modal.show{display:flex}
.box{background:#fff;border-radius:12px;padding:22px;width:min(720px,94vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2)}
.modalhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid #edf0ef}
.modalhead h3{margin:0;font-size:18px;color:#174c3d}
.login{position:fixed;inset:0;background:#174c3d;display:flex;align-items:center;justify-content:center;z-index:300}
.loginbox{background:#fff;padding:32px;border-radius:14px;width:400px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.35)}
.loginbox input{width:100%;padding:11px;margin:8px 0;border:1px solid #ccd6d1;border-radius:7px;outline:none}
.toast{position:fixed;right:24px;bottom:24px;background:#174c3d;color:#fff;padding:12px 20px;border-radius:8px;display:none;z-index:400;font-size:13px;font-weight:600}
.small{font-size:11px}
.actions{white-space:nowrap;display:flex;gap:6px}
.filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;background:#f9fbfb;padding:10px;border-radius:8px;border:1px solid #e1e8e5}
.filter-bar input,.filter-bar select{padding:7px 11px;border:1px solid #ccd6d1;border-radius:6px;font-size:12px;outline:none}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#eee;color:#555;font-weight:700;text-transform:uppercase}
.tag-admin{background:#dcfce7;color:#15803d}
.locked-banner{padding:10px 14px;background:#fef2f2;border-left:4px solid #ef4444;color:#991b1b;margin-bottom:14px;border-radius:0 6px 6px 0;font-size:13px;display:flex;align-items:center;gap:8px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.admin-card{background:#fff;border:1px solid #dfe6e2;border-radius:10px;padding:16px;cursor:pointer;transition:transform 0.15s, box-shadow 0.15s}
.admin-card:hover{transform:translateY(-3px);box-shadow:0 6px 12px rgba(0,0,0,0.08)}
.admin-card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.admin-card-header svg{width:20px;height:20px;stroke:#174c3d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:900px){aside{width:200px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}main{margin-left:200px}}
@media(max-width:650px){aside{display:none}main{margin-left:0;padding:16px}.cards,.form{grid-template-columns:1fr}}
</style>
</head>

let db = loadDB();
let current = "dashboard";

function loadDB() {
 try {
  const raw = localStorage.getItem(KEY);
  if (raw) return JSON.parse(raw);
 } catch(e){}
 localStorage.setItem(KEY, JSON.stringify(demo));
 return JSON.parse(JSON.stringify(demo));
}

function saveDB(msg = "✓ Saved successfully") {
 localStorage.setItem(KEY, JSON.stringify(db));
 showToast(msg);
}

function nextId(prefix) {
 return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,6);
}

function esc(s) {
 return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function getCurrentUser() {
 return JSON.parse(localStorage.getItem(SESSION) || "null");
}

function canEditModule(mod, targetCentre = null) {
 const u = getCurrentUser();
 if (!u) return false;
 if (u.accessLevel === "VIEW_ONLY" || u.role === "HR") return false;
 if (u.role === "ADMINISTRATOR" || u.role === "EXECUTIVE_DIRECTOR" || u.role === "EXECUTIVE_ASSISTANT" || u.accessLevel === "FULL") return true;
 
 if (u.role === "CENTRE_INCHARGE") {
   if (targetCentre && u.centre !== "All Centres" && targetCentre !== u.centre) {
     return false; 
   }
   return ["attendance", "production", "centres", "yarn", "workers", "payments", "tasks"].includes(mod);
 }
 if (mod === "training") {
   return ["PROJECT_HEAD_INTERNAL", "PROJECT_HEAD_EXTERNAL", "PROJECT_COORDINATOR"].includes(u.role);
 }
 return u.accessLevel === "EDIT";
}

function badge(s) {
 let cls = "badge";
 if (s === "Pending" || s === "Open" || s === "Medium" || s === "Half Day" || s === "In Progress") cls = "badge pending";
 else if (s === "Inactive" || s === "High" || s === "Absent") cls = "badge inactive";
 return `<span class="${cls}">${esc(s)}</span>`;
}

function showToast(msg) {
 const t = document.getElementById("toast");
 t.textContent = msg;
 t.style.display = "block";
 clearTimeout(window._toast);
 window._toast = setTimeout(() => t.style.display = "none", 2000);
}

function modal(title, html) {
 document.getElementById("mt").textContent = title;
 document.getElementById("mb").innerHTML = html;
 document.getElementById("modal").classList.add("show");
}

function closeM() {
 document.getElementById("modal").classList.remove("show");
}

document.getElementById("closeModal").onclick = closeM;
document.getElementById("logoutBtn").onclick = () => {
 localStorage.removeItem(SESSION);
 location.reload();
};

function applyQuickLogin() {
 const val = document.getElementById("quickLogin").value;
 if(val) {
   const [em, pw] = val.split("|");
   document.getElementById("loginEmail").value = em;
   document.getElementById("loginPass").value = pw;

function login() {
 const em = document.getElementById("loginEmail").value.trim().toLowerCase();
 const pw = document.getElementById("loginPass").value;
 const u = db.users.find(x => x.email.toLowerCase() === em && x.pass === pw);
 if (!u) {
   alert("Invalid Email or Password");
   return;
 }
 localStorage.setItem(SESSION, JSON.stringify(u));
 startApp();
 showToast(`Welcome, ${u.name}!`);
}

document.getElementById("loginBtn").onclick = login;

function startApp() {
 const s = getCurrentUser();
 if (!s) {
   document.getElementById("login").style.display = "flex";
   return;
 }
 document.getElementById("login").style.display = "none";
 document.getElementById("sessionUser").innerHTML = `<b>${esc(s.name)}</b> <span class="tag tag-admin">${esc(s.role)}</span> ${s.centre !== 'All Centres' ? `(${esc(s.centre)})` : ''}`;

 render(current);
}

function go(p) {
 current = p;
 document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.page === p));
 render(p);
}

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.page));

   dashboard, adminpanel, attendance, centres, production, workers, yarn, payments, training, tasks, reports, ai, users, backup

}

function saveAttendance(selectedCentre, date) {
 const u = getCurrentUser();
 const displayWorkers = selectedCentre === "All" 
   ? db.workers 
   : db.workers.filter(w => w.centre === selectedCentre);

 displayWorkers.forEach(w => {
   if (u.centre !== "All Centres" && u.centre !== w.centre) return;
   const statusVal = document.getElementById(`status_${w.id}`)?.value || "Present";
   const idx = db.attendance.findIndex(a => a.date === date && a.workerId === w.id);
   if (idx >= 0) {
     db.attendance[idx].status = statusVal;
   } else {
     db.attendance.push({ id: nextId("att"), date, centre: w.centre, workerId: w.id, workerName: w.name, status: statusVal });
   }
 });
 saveDB("✓ Attendance saved successfully");
 attendance();
}

   ${canEdit ? `<button class="btn primary" onclick="userModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add User Access</button>` : ""}
 </div>
 <div class="panel">
   <div class="table-responsive">
     <table>
       <tr><th>User Name</th><th>Email / Login ID</th><th>Assigned Role</th><th>Authorised Access Level</th><th>Authorised Centre Mapping</th><th>Actions</th></tr>
       ${db.users.map(u => `
         <tr>
           <td><b>${esc(u.name)}</b></td>
           <td>${esc(u.email)}</td>
           <td><span class="tag tag-admin">${esc(u.role)}</span></td>
           <td><b>${u.accessLevel === 'FULL' ? 'Full Access' : u.accessLevel === 'VIEW_ONLY' ? 'View Only' : 'Edit Access'}</b></td>
           <td><b>${esc(u.centre || 'All Centres')}</b></td>
           <td>
             ${canEdit ? `<button class="btn sm edit-btn" onclick="editUserModal('${u.id}')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit Role & Access</button>
             <button class="btn sm danger" onclick="delRecord('users','${u.id}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete</button>` : "Locked"}
           </td>
         </tr>
       `).join("")}
     </table>
   </div>
 </div>`;
}

function userModal(item = null) {
 if (!canEditModule("users")) return;
 const x = item || { name: "", email: "", role: "CENTRE_INCHARGE", pass: "123456", centre: "All Centres", accessLevel: "EDIT", phone: "" };
 modal(item ? "Edit User Access & Authorization" : "Add New User Access", `
   <div class="form">
     <div class="field"><label>Full Name *</label><input id="uName" value="${esc(x.name)}"></div>
     <div class="field"><label>Email ID *</label><input id="uEmail" value="${esc(x.email)}"></div>
     <div class="field"><label>Role / Role Title *</label>
       <select id="uRole">
         <option value="ADMINISTRATOR" ${x.role==="ADMINISTRATOR"?"selected":""}>Administrator</option>
         <option value="EXECUTIVE_DIRECTOR" ${x.role==="EXECUTIVE_DIRECTOR"?"selected":""}>Executive Director</option>
         <option value="EXECUTIVE_ASSISTANT" ${x.role==="EXECUTIVE_ASSISTANT"?"selected":""}>Executive Assistant</option>
         <option value="CENTRE_INCHARGE" ${x.role==="CENTRE_INCHARGE"?"selected":""}>Centre Incharge</option>
         <option value="PROJECT_HEAD_INTERNAL" ${x.role==="PROJECT_HEAD_INTERNAL"?"selected":""}>Project Head Internal</option>
         <option value="PROJECT_HEAD_EXTERNAL" ${x.role==="PROJECT_HEAD_EXTERNAL"?"selected":""}>Project Head External</option>
         <option value="PROJECT_COORDINATOR" ${x.role==="PROJECT_COORDINATOR"?"selected":""}>Project Coordinator</option>
         <option value="HR" ${x.role==="HR"?"selected":""}>HR</option>
       </select>
     </div>
     <div class="field"><label>Authorised Access Level (Permissions) *</label>
       <select id="uAccessLevel">
         <option value="FULL" ${x.accessLevel==="FULL"?"selected":""}>Full Access (All Admin Rights)</option>
         <option value="EDIT" ${x.accessLevel==="EDIT"?"selected":""}>Edit Access (Add/Modify Records)</option>
         <option value="VIEW_ONLY" ${x.accessLevel==="VIEW_ONLY"?"selected":""}>View Only Access (Read Only)</option>
       </select>
     </div>
     <div class="field"><label>Mapped / Authorised Centre *</label>
       <select id="uCentre">
         <option value="All Centres" ${x.centre==="All Centres"?"selected":""}>All Centres</option>
         ${db.centres.map(c => `<option value="${esc(c.name)}" ${x.centre===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}
       </select>
     </div>
     <div class="field"><label>Password</label><input id="uPass" value="${esc(x.pass)}"></div>
     <div class="field full"><label>Phone</label><input id="uPhone" value="${esc(x.phone || '')}"></div>
   </div>
   <br><button class="btn primary" id="saveUserBtn"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save User Authorisation</button>
 `);

 document.getElementById("saveUserBtn").onclick = () => {
   const data = { 
     name: val("uName"), 
     email: val("uEmail"), 
     role: val("uRole"), 
     accessLevel: val("uAccessLevel"),
     centre: val("uCentre"), 
     pass: val("uPass"),
     phone: val("uPhone")
   };
   if (!data.name || !data.email) return alert("User Name and Email required.");
   if (item) Object.assign(item, data);
   else db.users.push({ id: nextId("u"), ...data });
   saveDB("✓ User rights saved"); closeM(); users();
 };
}
function editUserModal(id) { userModal(db.users.find(u => u.id === id)); }

// 12. AI ASSISTANT
function ai() {
 document.getElementById("main").innerHTML = `
 <div class="title"><h2>AI Assistant (Ekal Intelligence Bot)</h2></div>
 <div class="panel">
   <p class="muted">Ask any question regarding Yarn allocation, Production output, or Centre details.</p>
   <div id="chatBox" style="min-height:200px;max-height:300px;overflow-y:auto;border:1px solid #edf0ef;padding:12px;border-radius:8px;background:#f9fbfb;margin-bottom:12px">
     <div><b>AI Assistant:</b> Namaste! Main Ekal Handloom AI Assistant hun. Aap mujhse production stats, yarn stock ya centre details puch sakte hain.</div>
   </div>
   <div style="display:flex;gap:8px">
     <input id="aiQuery" placeholder="Jaise: Total production kitna hai? Ya Yarn status batao..." style="flex:1;padding:10px;border:1px solid #ccd6d1;border-radius:6px">
     <button class="btn primary" onclick="askAI()">Send Question</button>
   </div>
 </div>`;
}

function askAI() {
 const q = val("aiQuery");
 if(!q) return;
 const chat = document.getElementById("chatBox");
 chat.innerHTML += `<div style="margin-top:8px"><b>You:</b> ${esc(q)}</div>`;
 
 let ans = "Mafi chahta hu, is prashna ka uttar samajh nahi aaya. Aap Production, Yarn, Centres ya Wages ke baare me puch sakte hain.";
 const qL = q.toLowerCase();
 
 if(qL.includes("production") || qL.includes("utpadan")) {
   const pcs = db.production.filter(x => x.unit === "Pieces").reduce((s, x) => s + Number(x.qty || 0), 0);
   const mtr = db.production.filter(x => x.unit === "Meter").reduce((s, x) => s + Number(x.qty || 0), 0);
   ans = `Kul Production Record: <b>${pcs} Pieces</b> aur <b>${mtr} Meters</b> fabric record kiya gaya hai.`;
 } else if(qL.includes("yarn") || qL.includes("sut")) {
   const tot = db.yarn.reduce((s, x) => s + Number(x.allocated || 0), 0);
   const pen = db.yarn.reduce((s, x) => s + Number(x.pending || 0), 0);
   ans = `Kul Allocated Yarn: <b>${tot} kg</b> aur Pending Yarn Stock: <b>${pen} kg</b> hai.`;
 } else if(qL.includes("centre") || qL.includes("center")) {
   ans = `Abhi kul <b>${db.centres.length} Active Centres</b> hain: ${db.centres.map(c=>c.name).join(", ")}.`;
 } else if(qL.includes("payment") || qL.includes("wage") || qL.includes("salary")) {
   const totP = db.payments.reduce((s,x)=>s+Number(x.amount||0), 0);
   ans = `Total Paid Wages: <b>₹${totP}</b> hain.`;
 }

 chat.innerHTML += `<div style="margin-top:8px;color:#174c3d"><b>AI Assistant:</b> ${ans}</div>`;
 document.getElementById("aiQuery").value = "";
 chat.scrollTop = chat.scrollHeight;
}

// 13. BACKUP & RESTORE
function backup() {
 document.getElementById("main").innerHTML = `
 <div class="title"><h2>Backup & Restore System</h2></div>
 <div class="panel">
   <h3>Database Export (Download Backup)</h3>
   <p class="muted">Download all active database records in JSON format.</p>
   <button class="btn primary" onclick="backupNow()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Complete JSON Backup</button>
 </div>
 
 <div class="panel" style="margin-top:16px">
   <h3>Database Import & Restore</h3>
   <p class="muted">Upload a valid JSON backup file to restore system database.</p>
   <input type="file" id="restoreFile" accept=".json" style="margin-bottom:10px"><br>
   <button class="btn primary" onclick="restoreDB()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Restore Database from JSON</button>
 </div>

 <div class="panel" style="margin-top:16px;border-color:#fecdca">
   <h3 style="color:#b42318">Reset Database</h3>
   <p class="muted">Reset system data back to default demo state.</p>
   <button class="btn danger" onclick="resetDB()"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Reset Data to Default</button>
 </div>`;
}

function backupNow() {
 const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");
 a.href = url;
 a.download = `ekal_backup_${new Date().toISOString().slice(0, 10)}.json`;
 a.click();
}

function restoreDB() {
 const fileInput = document.getElementById("restoreFile");
 if (!fileInput.files.length) {
   alert("Please select a JSON backup file to restore.");
   return;
 }
 const file = fileInput.files[0];
 const reader = new FileReader();
 reader.onload = function(e) {
   try {
     const importedData = JSON.parse(e.target.result);
     if (importedData && importedData.users && importedData.centres) {
       db = importedData;
       saveDB("✓ Database restored successfully!");
       go("dashboard");
     } else {
       alert("Invalid JSON data format.");
     }
   } catch (err) {
     alert("Error parsing JSON file.");
   }
 };
 reader.readAsText(file);
}

function resetDB() {
 if (confirm("Reset to default system data?")) {
   db = JSON.parse(JSON.stringify(demo));
   saveDB("✓ System reset successful");
   go("dashboard");
 }
}

 document.getElementById("main").innerHTML = `

 </div>
 <div class="panel" style="margin-top:16px">
   <h3>Centre-wise Production Report</h3>
   <div class="table-responsive">
     <table>
       <tr><th>Centre Name</th><th>State</th><th>Incharge</th><th>Recorded Output</th></tr>
       ${db.centres.map(c => `
         <tr>
           <td><b>${esc(c.name)}</b></td>
           <td>${esc(c.state)}</td>
           <td>${esc(c.incharge)}</td>
           <td>${db.production.filter(p=>p.centre===c.name).reduce((s,x)=>s+Number(x.qty||0),0)} units</td>
         </tr>
       `).join("")}

function delRecord(table, id) {
 if (!canEditModule(table)) return alert("Permission denied.");
 if (confirm("Permanently delete this record?")) {
   db[table] = db[table].filter(x => x.id !== id);
   saveDB("✓ Record deleted");
   render(current);
 }
}

startApp();
